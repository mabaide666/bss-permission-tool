<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS岗位权限查看器 Web V2</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--primary:#1f4e79;--blue:#2563eb;--line:#d9e2ef;--muted:#6b7280;--soft:#eef4ff;--text:#111827;--green:#16a34a;--orange:#f59e0b;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.header{padding:18px 24px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.04)}.header h1{margin:0;color:var(--primary);font-size:26px}.header p{margin:6px 0 0;color:var(--muted)}.toolbar{margin:14px 18px 8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:250px 120px 190px 140px 130px 1fr 130px 130px;gap:10px;align-items:end}.field label{display:block;font-weight:700;margin-bottom:6px;font-size:13px;color:#374151}select,input{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:14px}select[multiple]{height:78px}.check{display:flex;align-items:center;gap:8px;height:38px;font-weight:700;color:#374151}.check input{width:auto}.btn{padding:10px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700}.btn.secondary{background:#475569}.btn:hover{opacity:.92}.stats{margin:0 18px 8px;color:#374151;font-weight:700}.role-info{margin:0 18px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.role-info-title{padding:10px 12px;font-weight:800;border-bottom:1px solid var(--line);background:#f8fafc;display:flex;justify-content:space-between;align-items:center}.role-info-body{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.role-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:10px}.role-card h3{margin:0 0 6px;color:#0f172a;font-size:16px}.role-card .meta{color:#6b7280;font-size:13px;margin-bottom:6px}.role-card p{margin:0;white-space:pre-wrap;line-height:1.55}.analysis-bar{margin:0 18px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.analysis-chip{padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:700}.analysis-chip.green{background:#dcfce7;color:#166534}.analysis-chip.orange{background:#fef3c7;color:#92400e}.analysis-chip.red{background:#fee2e2;color:#991b1b}.main{display:grid;grid-template-columns:52% 48%;gap:12px;margin:0 18px 18px;height:calc(100vh - 300px);min-height:540px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.panel-title{padding:10px 12px;font-weight:800;border-bottom:1px solid var(--line);background:#f8fafc}.tree{padding:10px;overflow:auto;flex:1;font-size:14px}.tree ul{list-style:none;padding-left:20px;margin:0}.tree>ul{padding-left:0}.node-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer;user-select:none;white-space:nowrap}.node-row:hover{background:#eef4ff}.node-row.active{background:#dbeafe;color:#1d4ed8;font-weight:800}.toggle{width:18px;text-align:center;color:#475569;cursor:pointer}.toggle.placeholder{color:transparent}.badge{font-size:11px;padding:2px 6px;border-radius:999px;background:#e5e7eb;color:#374151;margin-left:4px}.badge.page{background:#dbeafe;color:#1d4ed8}.badge.button{background:#dcfce7;color:#166534}.badge.end{background:#fef3c7;color:#92400e}.perm{color:#16a34a;font-weight:900;margin-left:4px}.detail{overflow:auto;flex:1;padding:14px;line-height:1.6}.section{margin-bottom:18px}.section h2{font-size:17px;color:#0f172a;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid #e5e7eb}.desc-box{background:var(--soft);border-radius:12px;padding:12px;font-size:15px;font-weight:700;white-space:pre-wrap}.role-list{display:flex;flex-wrap:wrap;gap:8px}.role-chip{padding:6px 10px;border-radius:999px;background:#e0f2fe;color:#075985;font-weight:700}.role-chip.selected{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}.role-chip.no{background:#f3f4f6;color:#6b7280}.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;border-bottom:1px dashed #e5e7eb;padding:5px 0}.kv .k{font-weight:700;color:#374151}.empty{color:#6b7280;padding:16px}.hidden{display:none}.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;align-items:center;justify-content:center}.modal{width:min(860px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-header h2{margin:0;color:var(--primary)}.modal-body{padding:14px 16px}.close{border:none;background:#e5e7eb;padding:8px 10px;border-radius:8px;cursor:pointer}.quality-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.quality-card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#f8fafc}.quality-card .num{font-size:26px;font-weight:900;color:var(--primary)}.quality-list{margin-top:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.quality-list pre{white-space:pre-wrap;margin:0;font-family:Consolas,"Microsoft YaHei",monospace}@media(max-width:1200px){.toolbar{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr;height:auto}.panel{min-height:520px}}
</style>
</head>
<body>
<header class="header"><h1>BSS岗位权限查看器 Web V2</h1><p>支持岗位描述、多选岗位、并集/交集权限筛选、权限重叠分析和数据质量检查。</p></header>
<section class="toolbar">
  <div class="field"><label>岗位（可多选）</label><select id="roleSelect" multiple></select></div>
  <div class="field"><label>权限模式</label><select id="permissionMode"><option value="union">并集</option><option value="intersection">交集</option></select></div>
  <div class="field"><label>端类型</label><select id="endSelect"></select></div>
  <div class="field"><label>一级中心</label><select id="rootSelect"></select></div>
  <div class="field"><label>显示层级</label><select id="levelSelect"></select></div>
  <div class="field"><label>搜索</label><input id="searchInput" placeholder="输入菜单、路径、说明、备注、menu_id"></div>
  <label class="check"><input type="checkbox" id="onlyGranted">只看已授权</label>
  <button class="btn secondary" id="qualityBtn">数据质量检查</button>
</section>
<div class="stats" id="stats">正在加载数据...</div>
<section class="role-info" id="roleInfoBox"><div class="role-info-title"><span>岗位说明</span><span id="roleInfoHint">未选择岗位</span></div><div class="role-info-body" id="roleInfoBody"><div class="empty">请选择一个或多个岗位后查看岗位职责说明。</div></div></section>
<section class="analysis-bar" id="analysisBar"><span class="analysis-chip">权限分析：请选择岗位</span></section>
<main class="main"><section class="panel"><div class="panel-title">菜单树</div><div class="tree" id="tree"></div></section><section class="panel"><div class="panel-title">详情</div><div class="detail" id="detail"><div class="empty">请选择左侧菜单。</div></div></section></main>
<div class="modal-mask" id="qualityModal"><div class="modal"><div class="modal-header"><h2>数据质量检查</h2><button class="close" id="closeQuality">关闭</button></div><div class="modal-body" id="qualityBody"></div></div></div>
<script>
let rawData=null,menus=[],roles=[],roleDescriptions={};
const roleSelect=document.getElementById("roleSelect"),permissionMode=document.getElementById("permissionMode"),endSelect=document.getElementById("endSelect"),rootSelect=document.getElementById("rootSelect"),levelSelect=document.getElementById("levelSelect"),searchInput=document.getElementById("searchInput"),onlyGranted=document.getElementById("onlyGranted"),treeDiv=document.getElementById("tree"),detailDiv=document.getElementById("detail"),statsDiv=document.getElementById("stats"),roleInfoHint=document.getElementById("roleInfoHint"),roleInfoBody=document.getElementById("roleInfoBody"),analysisBar=document.getElementById("analysisBar"),qualityBtn=document.getElementById("qualityBtn"),qualityModal=document.getElementById("qualityModal"),closeQuality=document.getElementById("closeQuality"),qualityBody=document.getElementById("qualityBody");
function safeText(v){return(v===null||v===undefined)?"":String(v).trim()}function esc(s){return safeText(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function unique(a){return[...new Set(a.filter(x=>safeText(x)))]}function selectedRoles(){return[...roleSelect.selectedOptions].map(o=>o.value).filter(Boolean)}
function getLevelKeys(){if(!menus.length)return[];const keys=new Set();menus.forEach(m=>Object.keys(m.levels||{}).forEach(k=>keys.add(k)));return[...keys].sort((a,b)=>Number(a.split("_")[1])-Number(b.split("_")[1]))}
function getPathLevels(menu,limit){const vals=[];getLevelKeys().forEach(k=>{const n=Number(k.split("_")[1]),v=safeText(menu.levels?.[k]);if(v&&(!limit||n<=limit))vals.push(v)});return vals}
function roleGranted(m,r){return(m.roles||[]).includes(r)}function selectedRoleCountForMenu(m){return selectedRoles().filter(r=>roleGranted(m,r)).length}
function menuMatchesSelectedRoles(m){const s=selectedRoles();if(!s.length)return false;return permissionMode.value==="intersection"?s.every(r=>roleGranted(m,r)):s.some(r=>roleGranted(m,r))}
function filteredMenus(){const s=selectedRoles(),end=endSelect.value,root=rootSelect.value,kw=safeText(searchInput.value).toLowerCase();return menus.filter(m=>{if(end!=="全部"&&safeText(m.end_type)!==end)return false; if(root!=="全部"&&safeText(m.levels?.level_1)!==root)return false; if(onlyGranted.checked&&s.length&&!menuMatchesSelectedRoles(m))return false; if(kw){const pool=[m.menu_id,m.end_type,m.menu_type,m.full_path,m.function_desc,m.remark,m.original_path,...Object.values(m.levels||{}),...(m.roles||[])].join(" ").toLowerCase();if(!pool.includes(kw))return false}return true})}
function buildTree(items){const lt=levelSelect.value,limit=lt==="全部"?null:Number(lt.replace("level_","")),root={children:{},rows:[]};items.forEach(m=>{const levels=getPathLevels(m,limit);if(!levels.length)return;let cur=root;levels.forEach((label,i)=>{const last=i===levels.length-1;let key=label;if(last&&!limit&&["页面","按钮"].includes(safeText(m.menu_type)))key=label+"__"+safeText(m.menu_id);if(!cur.children[key])cur.children[key]={label,children:{},rows:[],key};cur=cur.children[key];cur.rows.push(m)})});return root}
function renderTree(){const items=filteredMenus(),pages=items.filter(m=>safeText(m.menu_type)==="页面").length,buttons=items.filter(m=>safeText(m.menu_type)==="按钮").length;statsDiv.textContent=`当前菜单数：${items.length}    页面数：${pages}    按钮数：${buttons}`;renderRoleInfo();renderRoleAnalysis();treeDiv.innerHTML="";treeDiv.appendChild(renderNodeChildren(buildTree(items)))}
function renderNodeChildren(node){const ul=document.createElement("ul");Object.values(node.children).forEach(child=>{const li=document.createElement("li"),row=document.createElement("div");row.className="node-row";const has=Object.keys(child.children).length>0,t=document.createElement("span");t.className=has?"toggle":"toggle placeholder";t.textContent=has?"▾":"·";const label=document.createElement("span");label.textContent=child.label;row.appendChild(t);row.appendChild(label);const s=selectedRoles(),g=child.rows.reduce((max,m)=>Math.max(max,selectedRoleCountForMenu(m)),0);if(s.length&&g){const p=document.createElement("span");p.className="perm";p.textContent=permissionMode.value==="intersection"&&g===s.length?"√共同":`√${g}`;row.appendChild(p)}const first=child.rows[0]||{};if(!has){const type=safeText(first.menu_type);if(type){const b=document.createElement("span");b.className="badge "+(type==="页面"?"page":type==="按钮"?"button":"");b.textContent=type;row.appendChild(b)}const end=safeText(first.end_type);if(end){const e=document.createElement("span");e.className="badge end";e.textContent=end;row.appendChild(e)}}row.onclick=e=>{e.stopPropagation();document.querySelectorAll(".node-row.active").forEach(x=>x.classList.remove("active"));row.classList.add("active");renderDetail(child)};li.appendChild(row);if(has){const childUl=renderNodeChildren(child);li.appendChild(childUl);t.onclick=e=>{e.stopPropagation();childUl.classList.toggle("hidden");t.textContent=childUl.classList.contains("hidden")?"▸":"▾"}}ul.appendChild(li)});return ul}
function renderRoleInfo(){const s=selectedRoles();if(!s.length){roleInfoHint.textContent="未选择岗位";roleInfoBody.innerHTML='<div class="empty">请选择一个或多个岗位后查看岗位职责说明。</div>';return}roleInfoHint.textContent=`已选择 ${s.length} 个岗位`;roleInfoBody.innerHTML=s.map(r=>{const info=roleDescriptions[r]||{},desc=safeText(info.description)||"暂无岗位描述",end=safeText(info.end_type)||"-",remark=safeText(info.remark);return `<div class="role-card"><h3>${esc(r)}</h3><div class="meta">岗位归属：${esc(end)}</div><p>${esc(desc)}</p>${remark?`<div class="meta" style="margin-top:8px;">备注：${esc(remark)}</div>`:""}</div>`}).join("")}
function renderRoleAnalysis(){const s=selectedRoles();if(!s.length){analysisBar.innerHTML='<span class="analysis-chip">权限分析：请选择岗位</span>';return}const roleCounts={};s.forEach(r=>roleCounts[r]=0);let union=0,inter=0;menus.forEach(m=>{const c=s.filter(r=>roleGranted(m,r)).length;if(c>0)union++;if(c===s.length)inter++;s.forEach(r=>{if(roleGranted(m,r))roleCounts[r]++})});analysisBar.innerHTML=`${s.length>1?`<span class="analysis-chip green">共同权限：${inter}</span><span class="analysis-chip orange">合计权限：${union}</span>`:`<span class="analysis-chip green">该岗位权限：${union}</span>`}${s.map(r=>`<span class="analysis-chip">${esc(r)}：${roleCounts[r]}</span>`).join("")}<span class="analysis-chip red">当前模式：${permissionMode.value==="intersection"?"交集":"并集"}</span>`}
function renderDetail(node){const rows=node.rows||[];if(!rows.length){detailDiv.innerHTML='<div class="empty">这是目录节点。</div>';return}const first=rows[0],granted=unique(rows.flatMap(m=>m.roles||[])),s=selectedRoles(),status=roles.map(r=>({role:r,granted:rows.some(m=>(m.roles||[]).includes(r)),selected:s.includes(r)})),folded=rows.length>1&&Object.keys(node.children||{}).length>0,desc=safeText(first.function_desc)||"未填写",remark=safeText(first.remark)||"-";detailDiv.innerHTML=`${folded?`<div class="section"><h2>折叠层级提示</h2><div class="desc-box">当前节点下包含 ${rows.length} 条菜单资源。如需查看更细菜单，请调整“显示层级”。</div></div>`:""}<div class="section"><h2>功能说明</h2><div class="desc-box">${esc(desc)}</div></div><div class="section"><h2>权限情况</h2><div class="role-list">${granted.length?granted.map(r=>`<span class="role-chip ${s.includes(r)?"selected":""}">${esc(r)}</span>`).join(""):'<span class="role-chip no">暂无已授权岗位</span>'}</div></div><div class="section"><h2>完整信息</h2><div class="kv"><div class="k">menu_id</div><div>${esc(safeText(first.menu_id))}</div></div><div class="kv"><div class="k">端类型</div><div>${esc(safeText(first.end_type)||"-")}</div></div><div class="kv"><div class="k">菜单类型</div><div>${esc(safeText(first.menu_type)||"-")}</div></div><div class="kv"><div class="k">完整路径</div><div>${esc(safeText(first.full_path))}</div></div><div class="kv"><div class="k">重复标识</div><div>${esc(safeText(first.duplicate_flag)||"-")} ${esc(safeText(first.duplicate_group)||"")}</div></div></div><div class="section"><h2>全部岗位权限状态</h2><div class="role-list">${status.map(x=>`<span class="role-chip ${x.granted?(x.selected?"selected":""):"no"}">${x.granted?"√":"×"} ${esc(x.role)}</span>`).join("")}</div></div><div class="section"><h2>层级信息</h2>${Object.entries(first.levels||{}).filter(([k,v])=>safeText(v)).map(([k,v])=>`<div class="kv"><div class="k">${esc(k)}</div><div>${esc(v)}</div></div>`).join("")}</div><div class="section"><h2>备注</h2><div class="desc-box">${esc(remark)}</div></div>`}
function renderQuality(){const q=rawData.quality||{},noRoleDesc=q.no_role_description_roles||[],noRoleMenus=q.no_role_menu_ids||[],noDescMenus=q.no_function_desc_menu_ids||[];qualityBody.innerHTML=`<div class="quality-grid"><div class="quality-card"><div>菜单总数</div><div class="num">${q.menu_count??menus.length}</div></div><div class="quality-card"><div>岗位总数</div><div class="num">${q.role_count??roles.length}</div></div><div class="quality-card"><div>无岗位授权菜单</div><div class="num">${q.no_role_menu_count??0}</div></div><div class="quality-card"><div>无功能说明菜单</div><div class="num">${q.no_function_desc_menu_count??0}</div></div><div class="quality-card"><div>重复菜单组</div><div class="num">${q.duplicate_group_count??0}</div></div><div class="quality-card"><div>无岗位描述</div><div class="num">${q.no_role_description_count??0}</div></div></div><div class="quality-list"><h3>无岗位描述岗位</h3><pre>${noRoleDesc.length?esc(noRoleDesc.join("\n")):"无"}</pre></div><div class="quality-list"><h3>无岗位授权菜单 menu_id（最多显示200条）</h3><pre>${noRoleMenus.length?esc(noRoleMenus.join("\n")):"无"}</pre></div><div class="quality-list"><h3>无功能说明菜单 menu_id（最多显示200条）</h3><pre>${noDescMenus.length?esc(noDescMenus.join("\n")):"无"}</pre></div>`}
function initFilters(){roles=rawData.roles||[];menus=rawData.menus||[];roleDescriptions=rawData.role_descriptions||{};roleSelect.innerHTML=roles.map(x=>`<option>${esc(x)}</option>`).join("");endSelect.innerHTML=["全部",...unique(menus.map(m=>m.end_type))].map(x=>`<option>${esc(x)}</option>`).join("");rootSelect.innerHTML=["全部",...unique(menus.map(m=>m.levels?.level_1)).sort()].map(x=>`<option>${esc(x)}</option>`).join("");const max=getLevelKeys().length;levelSelect.innerHTML=["全部",...Array.from({length:max},(_,i)=>`level_${i+1}`)].map(x=>`<option>${esc(x)}</option>`).join("");[roleSelect,permissionMode,endSelect,rootSelect,levelSelect,onlyGranted].forEach(el=>el.addEventListener("change",renderTree));searchInput.addEventListener("input",renderTree);qualityBtn.onclick=()=>{renderQuality();qualityModal.style.display="flex"};closeQuality.onclick=()=>qualityModal.style.display="none";qualityModal.onclick=e=>{if(e.target===qualityModal)qualityModal.style.display="none"};renderTree()}
fetch("data.json").then(res=>res.json()).then(data=>{rawData=data;initFilters()}).catch(err=>{statsDiv.textContent="data.json 加载失败";treeDiv.innerHTML='<div class="empty">无法读取 data.json，请确认文件已上传到仓库根目录。</div>';console.error(err)});
</script>
</body>
</html>
